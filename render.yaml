services:
  - type: web
    name: stock-portfolio-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /var/data/stock_unifier.db
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: CORS_ORIGINS
        value: https://stock-portfolio-web.onrender.com
    disk:
      name: spu-data
      mountPath: /var/data
      sizeGB: 1
