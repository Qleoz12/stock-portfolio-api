services:
  - type: web
    name: stock-portfolio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_PATH
        value: /app/stock_unifier.db
      - key: DB_REPO
        value: Qleoz12/stock-portfolio-db
      - key: DB_RELEASE_TAG
        value: v1.0.0
      - key: DB_ASSET_NAME
        value: stock_unifier.db
      - key: CORS_ORIGINS
        value: "*"
      # Set GITHUB_TOKEN manually in Render dashboard (secret)
